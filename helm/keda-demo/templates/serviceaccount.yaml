{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda-demo.serviceAccountName" . }}
  namespace: {{ include "keda-demo.namespace" . }}
  labels:
    {{- include "keda-demo.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.aws.irsaRoleArn }}
    # IRSA: links this ServiceAccount to the AWS IAM role via OIDC
    # The kubelet exchanges the ServiceAccount token for AWS credentials
    # using the cluster's OIDC provider URL
    eks.amazonaws.com/role-arn: {{ .Values.aws.irsaRoleArn | quote }}
    {{- end }}
{{- end }}
