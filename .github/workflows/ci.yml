# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
# =============================================================================
# Runs on every Pull Request targeting main.
# Provides fast feedback (< 5 minutes) before code is merged.
#
# Jobs:
#   lint           → pre-commit hooks (black, isort, conventional commit check)
#   test (matrix)  → pytest on Python 3.10, 3.11, 3.12 (matrix strategy)
#   chaos-dry-run  → chaos-test.sh --dry-run (validates script, no cluster)
#   docker-build   → validate Dockerfile builds (no push)
#   terraform-validate → fmt check + validate all .tf files
#
# Why matrix testing (3.10, 3.11, 3.12)?
#   Python syntax changes between minor versions (e.g. match/case in 3.10,
#   tomllib in 3.11, type aliases in 3.12). Matrix CI catches compatibility
#   issues before they affect deployments on different base images.
#
# Why CI ≠ CD?
#   CI: runs on PRs — checks code quality, never touches production
#   CD: runs on merge to main — has AWS credentials, touches real infra
# =============================================================================

name: CI — Lint, Test, Build

on:
  pull_request:
    branches: [main]
    paths:
      - "application/**"
      - "ai/**"
      - "manifests/**"
      - "helm/**"
      - "scripts/**"
      - "terraform/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"

  workflow_dispatch:

# Cancel in-progress CI runs when a new commit is pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate PR title follows Conventional Commits
        # PR title becomes the squash-merge commit message
        if: github.event_name == 'pull_request'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: ${PR_TITLE}"
          if ! echo "${PR_TITLE}" | grep -qE "^(feat|fix|docs|chore|test|refactor|perf|style|ci|build|revert)(\(.+\))?: .{1,80}"; then
            echo "❌ PR title does not follow Conventional Commits format"
            echo "   Expected: <type>(<scope>): <short description>"
            echo "   Example:  feat(sqs): add dead letter queue configuration"
            exit 1
          fi
          echo "✅ PR title follows Conventional Commits format"

  # ── Job 2: Test Matrix (Python 3.10, 3.11, 3.12) ──────────────────────────
  test:
    name: Unit Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint  # Only run tests if lint passes

    strategy:
      fail-fast: false  # Run all matrix versions even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: application/requirements*.txt

      - name: Install production + dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        # No real AWS credentials needed: moto intercepts boto3 calls
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789/test-queue
        run: |
          python -m pytest test_app.py \
            --verbose \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Run chaos/resilience unit tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest chaos_test.py \
            --verbose \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'  # Only upload once, not 3 times
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: application/coverage.xml
          retention-days: 7

  # ── Job 3: AI Module Tests ─────────────────────────────────────────────────
  test-ai:
    name: AI Module Tests — Python 3.11
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AI module dependencies
        run: pip install -r requirements.txt pytest

      - name: Run AI predictor tests
        run: python -m pytest test_predictor.py --verbose --tb=short

      - name: Run predictor demo (smoke test)
        run: |
          python predictor.py 2>&1 | tail -5
          echo "✅ AI predictor demo ran without errors"

  # ── Job 4: Chaos Script Dry-Run ───────────────────────────────────────────
  chaos-dry-run:
    name: Chaos Script Dry-Run (no cluster)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl (for script parsing)
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"

      - name: Validate chaos test script (dry-run)
        # --dry-run flag: script prints what would run, no real cluster calls
        # This catches bash syntax errors and missing variables before cluster use
        run: |
          bash scripts/chaos-test.sh --dry-run --namespace keda-demo
          echo "✅ Chaos test script syntax valid"

      - name: Shellcheck: static analysis on all bash scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # ── Job 5: Docker Build ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build (validate Dockerfile)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./application
          file: ./application/Dockerfile
          push: false
          tags: keda-demo-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image built
        run: |
          echo "✅ Docker build succeeded for commit ${{ github.sha }}"
          echo "   Image: keda-demo-app:ci-${{ github.sha }}"
          echo "   CD workflow pushes to ECR on merge to main"

  # ── Job 6: Terraform Validate ─────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (local backend — no AWS creds needed)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ── Job 7: Helm Lint ──────────────────────────────────────────────────────
  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm Lint (with required values)
        run: |
          helm lint ./helm/keda-demo \
            --set image.repository=test-registry/test-app \
            --set aws.sqsQueueUrl=https://sqs.us-east-1.amazonaws.com/123/test-queue \
            --set aws.irsaRoleArn=arn:aws:iam::123456789:role/test-role
          echo "✅ Helm chart linting passed"

      - name: Helm Template (dry-run render)
        run: |
          helm template keda-demo ./helm/keda-demo \
            --set image.repository=test-registry/test-app \
            --set aws.sqsQueueUrl=https://sqs.us-east-1.amazonaws.com/123/test-queue \
            --set aws.irsaRoleArn=arn:aws:iam::123456789:role/test-role \
            | grep "^kind:" | sort | uniq -c
          echo "✅ Helm template rendering succeeded"

  # ── CI Summary Gate ───────────────────────────────────────────────────────
  # All jobs must pass before a PR can be merged (configure in branch rules)
  ci-success:
    name: CI Passed ✅
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - test-ai
      - chaos-dry-run
      - docker-build
      - terraform-validate
      - helm-lint
    steps:
      - name: All CI checks passed
        run: |
          echo "✅ All CI jobs passed for PR #${{ github.event.pull_request.number }}"
          echo "   Safe to review and merge."
