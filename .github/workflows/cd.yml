# =============================================================================
# .github/workflows/cd.yml — Continuous Deployment
# =============================================================================
# Runs on every merge to main (push event after PR is merged).
# Builds the Docker image, pushes to ECR, and deploys to EKS.
#
# AWS Authentication: GitHub OIDC (no static AWS keys stored in GitHub Secrets)
# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions supports OIDC identity federation with AWS.
# Flow:
#   1. GitHub generates a short-lived JWT for this workflow run
#   2. aws-actions/configure-aws-credentials exchanges JWT for STS temp creds
#   3. STS validates JWT against GitHub's OIDC provider
#   4. STS checks the IAM role trust policy:
#        Condition: token.actions.githubusercontent.com:sub
#                   == repo:Harshads-git/aws-keda-eks-autoscaling:ref:refs/heads/main
#   5. Returns 15-minute temporary credentials
#
# Required GitHub Secrets (from Settings → Secrets → Actions):
#   AWS_ACCOUNT_ID   → your 12-digit AWS account ID (e.g., 183264980)
#   AWS_REGION       → us-east-1
#   EKS_CLUSTER_NAME → keda-demo-dev-cluster
#   SQS_QUEUE_URL    → output of: terraform output -raw sqs_queue_url
#
# Required: Run scripts/setup-github-oidc.sh (created Day 14) to:
#   - Create IAM role for GitHub Actions
#   - Register GitHub OIDC provider in AWS IAM
# =============================================================================

name: CD — Build, Push, Deploy

on:
  push:
    branches: [main]
    paths:
      - "application/**"
      - "manifests/**"
      - "kustomize/**"
      - ".github/workflows/cd.yml"

  # Manual deployment trigger (useful for rollbacks or hotfixes)
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest sha)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev]
        default: dev

concurrency:
  # Only one CD run at a time — prevents concurrent deploys to the same cluster
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # false: never cancel a running deployment

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPO_NAME: keda-demo-app
  K8S_NAMESPACE: keda-demo
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Build & Push Docker Image to ECR ───────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      # Pass the image tag to the deploy job
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_image: ${{ steps.meta.outputs.ecr_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS Authentication via OIDC ────────────────────────────────────────
      # No static AWS keys! GitHub generates a short-lived JWT.
      # The IAM role trust policy restricts this to main branch only.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-keda-demo
          aws-region: ${{ env.AWS_REGION }}
          # role-session-name appears in CloudTrail logs for auditability
          role-session-name: GitHubActions-${{ github.run_id }}

      # ── ECR Authentication ─────────────────────────────────────────────────
      - name: Authenticate Docker to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Compute Image Tag ──────────────────────────────────────────────────
      - name: Set image metadata
        id: meta
        run: |
          # Use short SHA for traceability (links image to exact commit)
          SHORT_SHA="${GITHUB_SHA::8}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          # Use manual override if provided via workflow_dispatch
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi

          ECR_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPO_NAME }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"

          echo "📦 Building image: ${ECR_IMAGE}"

      # ── Docker Build & Push ────────────────────────────────────────────────
      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./application
          file: ./application/Dockerfile
          push: true    # CD: actually push to ECR (unlike CI which uses push: false)
          tags: |
            ${{ steps.meta.outputs.ecr_image }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:latest
          # Build args for image labels (traceability)
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Use GitHub Actions cache to speed up repeated builds (~30s vs ~2min)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image details
        run: |
          echo "✅ Image pushed to ECR:"
          echo "   URI: ${{ steps.meta.outputs.ecr_image }}"
          echo "   Tag: ${{ steps.meta.outputs.image_tag }}"
          echo "   SHA: ${{ github.sha }}"

  # ── Job 2: Deploy to EKS ──────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push   # Only deploy if build succeeded
    # Protect production deployments with GitHub Environments
    # Configure in: Settings → Environments → dev → required reviewers
    environment:
      name: dev
      url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-keda-demo
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ kubectl configured for cluster: ${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Set image tag for deployment
        id: image
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPO_NAME }}" \
            --query 'repositories[0].repositoryUri' \
            --output text | sed 's|/.*||')
          ECR_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPO_NAME }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy Kubernetes manifests
        env:
          SQS_QUEUE_URL:  ${{ secrets.SQS_QUEUE_URL }}
          IMAGE_TAG:      ${{ steps.image.outputs.image_tag }}
          ECR_REPO_URI:   ${{ steps.image.outputs.ecr_image }}
          AWS_REGION:     ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: bash scripts/deploy-all-manifests.sh

      - name: Wait for rollout to complete
        run: |
          echo "⏳ Waiting for deployment rollout..."
          kubectl rollout status deployment/keda-demo \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=300s
          echo "✅ Deployment rollout complete"

      - name: Verify deployment
        run: |
          echo "📊 Deployment status:"
          kubectl get pods -n "${{ env.K8S_NAMESPACE }}"
          echo ""
          echo "📊 ScaledObject status:"
          kubectl get scaledobject -n "${{ env.K8S_NAMESPACE }}"

      - name: Post deploy summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ steps.image.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${{ secrets.EKS_CLUSTER_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${{ env.K8S_NAMESPACE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
