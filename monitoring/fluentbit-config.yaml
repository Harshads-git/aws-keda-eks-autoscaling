# =============================================================================
# monitoring/fluentbit-config.yaml — Fluent Bit Log Collection Pipeline
# =============================================================================
# Fluent Bit runs as a DaemonSet (one per node). It tails container log files,
# parses the JSON structure, enriches with Kubernetes metadata, and forwards
# to the configured output (stdout for local, CloudWatch for production).
#
# Pipeline: Container Log File → Tail Input → JSON Parser → K8s Filter → Output
#
# Why Fluent Bit over Fluentd:
#   Fluent Bit: ~450KB memory, written in C, single binary
#   Fluentd: ~40MB memory, written in Ruby, plugin ecosystem
#   For our use case (simple JSON parsing + forwarding), Fluent Bit is sufficient.
#
# Install (Helm):
#   helm repo add fluent https://fluent.github.io/helm-charts
#   helm install fluent-bit fluent/fluent-bit \
#     --namespace monitoring --create-namespace \
#     --values monitoring/fluentbit-config.yaml
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
data:
  # ── Main Fluent Bit configuration ──────────────────────────────────────────
  fluent-bit.conf: |
    [SERVICE]
        # Flush interval: how often buffered logs are sent to the output
        Flush         5
        # Log level for Fluent Bit itself (not the application logs)
        Log_Level     info
        # Enable built-in HTTP server for Fluent Bit health checks
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        # Parsers file location
        Parsers_File  parsers.conf

    # ── INPUT: Tail container log files ──────────────────────────────────────
    # Kubernetes writes container stdout/stderr to:
    #   /var/log/containers/<pod>_<namespace>_<container>-<id>.log
    # Fluent Bit tails these files and reads new lines as they appear.
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/keda-demo*.log
        # Only collect logs from keda-demo pods (not system pods)
        Parser            docker
        # DB file tracks read positions across Fluent Bit restarts
        DB                /var/log/flb_kube.db
        # Memory buffer limit per file (prevents OOM on log storms)
        Mem_Buf_Limit     5MB
        # Skip lines longer than 1MB (prevents single huge log line from blocking)
        Buffer_Max_Size   1MB
        # How often to check for new log files
        Refresh_Interval  10

    # ── FILTER: Parse JSON body from container log line ──────────────────────
    # Container runtime wraps the application JSON log in its own JSON:
    #   {"log": "{\"level\":\"INFO\",\"message\":\"Processing...\"}","stream":"stdout","time":"..."}
    # This filter extracts the inner JSON so we get clean structured fields.
    [FILTER]
        Name          parser
        Match         kube.*
        Key_Name      log
        Parser        json_parser
        Reserve_Data  On
        Preserve_Key  Off

    # ── FILTER: Enrich with Kubernetes metadata ──────────────────────────────
    # Adds: pod_name, namespace, container_name, labels, annotations
    # This data comes from the Kubernetes API (Fluent Bit queries it once per pod).
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        # Merge the Kubernetes metadata into the log record
        Merge_Log           On
        Merge_Log_Key       log_processed
        # Cache Kubernetes API responses (reduces API calls)
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        # Only keep relevant labels (reduces log volume)
        Labels              On
        Annotations         Off

    # ── FILTER: Add environment tag ──────────────────────────────────────────
    # Adds a static field 'environment' to every log for multi-env filtering.
    [FILTER]
        Name   modify
        Match  kube.*
        Add    environment local
        Add    application smartscale-ai

    # ── OUTPUT: stdout (local development) ───────────────────────────────────
    # In local/dev: print enriched logs to stdout for kubectl logs inspection.
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines

    # ── OUTPUT: CloudWatch Logs (production, uncomment when deploying to AWS) ─
    # [OUTPUT]
    #     Name              cloudwatch_logs
    #     Match             kube.*
    #     region            us-east-1
    #     log_group_name    /aws/eks/keda-demo-dev-cluster/keda-demo
    #     log_stream_prefix consumer-
    #     auto_create_group On

    # ── OUTPUT: File (for log archival or debugging) ─────────────────────────
    # [OUTPUT]
    #     Name   file
    #     Match  kube.*
    #     Path   /var/log/fluent-bit/
    #     File   keda-demo.log

  # ── Parsers ────────────────────────────────────────────────────────────────
  parsers.conf: |
    # Docker/containerd log format parser
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

    # Application JSON log parser (inner JSON from python-json-logger)
    [PARSER]
        Name        json_parser
        Format      json
        Time_Key    asctime
        Time_Format %Y-%m-%dT%H:%M:%S

---
# ── DaemonSet: Fluent Bit (one per node) ─────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        # Run on all nodes including tainted ones (Spot instances)
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.0
          ports:
            - containerPort: 2020
              name: http
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config

---
# ── ServiceAccount for Kubernetes API access ─────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring

---
# ── ClusterRole: read pods and namespaces for metadata enrichment ────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
