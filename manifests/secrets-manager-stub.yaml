# manifests/secrets-manager-stub.yaml
# =============================================================================
# AWS Secrets Manager Integration via Secrets Store CSI Driver
# =============================================================================
# This file documents how to mount AWS Secrets Manager secrets as files or
# environment variables into the consumer pod WITHOUT hardcoding secrets.
#
# Current state (this demo): no secrets are stored in Secrets Manager because
#   - AWS credentials: handled by IRSA (no static keys)
#   - SQS URL: not sensitive (it's in the ConfigMap)
#   - No database passwords or API keys in this demo
#
# This stub shows the PATTERN for when you add real secrets (e.g. a database
# password, third-party API key, or webhook secret) to this workload.
#
# Prerequisites:
#   1. Install Secrets Store CSI Driver:
#      helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#      helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver -n kube-system
#
#   2. Install AWS Provider for Secrets Store CSI Driver:
#      kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml
#
#   3. Add Secrets Manager permissions to the consumer IRSA role:
#      In terraform/modules/irsa/main.tf, add to consumer policy:
#        "secretsmanager:GetSecretValue",
#        "secretsmanager:DescribeSecret"
#      With resource: "arn:aws:secretsmanager:<region>:<account>:secret:keda-demo/*"
#
# GCP equivalent: Secret Manager + Workload Identity (same concept, different API)
# =============================================================================

# ── SecretProviderClass: tells CSI driver which secrets to fetch ──────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keda-demo-aws-secrets
  namespace: keda-demo
  labels:
    app.kubernetes.io/name: keda-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "keda-demo/app-secret"     # Secret name in AWS Secrets Manager
        objectType: "secretsmanager"
        objectAlias: "app-secret.json"          # Filename when mounted as volume
        # objectVersion: "AWSCURRENT"           # Default: always get latest
  secretObjects:
    # Creates a Kubernetes Secret from the AWS Secret value
    # The K8s Secret is kept in sync with AWS Secrets Manager automatically
    - secretName: keda-demo-app-secret          # K8s Secret name
      type: Opaque
      data:
        - objectName: app-secret.json
          key: api-key                          # Key within the JSON secret
          # Assumes AWS secret value is JSON: {"api-key": "...", "db-password": "..."}

# ── To USE this in the Deployment (add to deployment.yaml spec): ──────────────
# volumes:
#   - name: secrets-store
#     csi:
#       driver: secrets-store.csi.k8s.io
#       readOnly: true
#       volumeAttributes:
#         secretProviderClass: "keda-demo-aws-secrets"   # References above
#
# containers:
#   - name: consumer
#     volumeMounts:
#       - name: secrets-store
#         mountPath: "/mnt/secrets"      # Secrets mounted as files here
#         readOnly: true
#     env:
#       # Option A: Mount secret value as env var (from K8s Secret)
#       - name: API_KEY
#         valueFrom:
#           secretKeyRef:
#             name: keda-demo-app-secret  # K8s Secret created by CSI driver
#             key: api-key
#       # Option B: Read file directly in app.py
#       #   with open('/mnt/secrets/app-secret.json') as f:
#       #       secrets = json.load(f)
#       #       api_key = secrets['api-key']

# ── When NOT to use Secrets Manager (when IRSA is enough) ────────────────────
# The consumer app in this demo needs NO Secrets Manager because:
#   AWS credentials → IRSA provides temporary credentials via projected token
#   SQS Queue URL   → not sensitive, in ConfigMap
#   AWS Region      → not sensitive, in ConfigMap
#
# Secrets Manager adds operational overhead (extra IAM, CSI driver, sync lag).
# Only use it when you have ACTUAL secrets (passwords, API keys, TLS certs).
#
# Decision tree:
#   Q: Is this an AWS credential?          → Use IRSA
#   Q: Is this non-sensitive config?        → Use ConfigMap
#   Q: Is this a password/key/cert?         → Use Secrets Manager + CSI Driver
#   Q: Is this a K8s native secret?        → Use K8s Secret (encrypted at rest)
