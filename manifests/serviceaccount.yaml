# =============================================================================
# serviceaccount.yaml — Kubernetes ServiceAccount with IRSA Annotation
# =============================================================================
# This is the AWS equivalent of GCP Workload Identity used in the reference repo.
#
# GCP (reference repo):
#   ServiceAccount annotated with:
#   iam.gke.io/gcp-service-account: keda-demo@<project>.iam.gserviceaccount.com
#
# AWS (this project) — IRSA (IAM Roles for Service Accounts):
#   ServiceAccount annotated with:
#   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/keda-demo-app-role
#
# How IRSA works:
#   1. Pod starts → K8s injects a signed JWT (projected ServiceAccount token)
#      into the pod at: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
#   2. boto3 / AWS SDK calls: STS AssumeRoleWithWebIdentity(JWT)
#   3. AWS STS validates JWT against EKS cluster's OIDC public key
#   4. STS issues temporary credentials (1 hour, auto-refreshed)
#   5. Credentials scoped to exactly the IAM role — no more, no less
#
# Apply: kubectl apply -f manifests/serviceaccount.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-demo
  namespace: keda-demo
  labels:
    app.kubernetes.io/name: keda-demo
    app.kubernetes.io/component: consumer
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # ─── IRSA Annotation ───────────────────────────────────────────────────────
    # This annotation is what links the K8s ServiceAccount to the AWS IAM role.
    # The role ARN is created by Terraform on Day 10 (terraform/modules/irsa/).
    #
    # Replace <ACCOUNT_ID> with your 12-digit AWS account ID.
    # This value will be updated automatically by scripts/deploy-all-manifests.sh
    # using: envsubst < manifests/serviceaccount.yaml | kubectl apply -f -
    #
    # IAM Role permissions granted to pods using this SA:
    #   - sqs:ReceiveMessage       (receive messages from the queue)
    #   - sqs:DeleteMessage        (delete messages after processing)
    #   - sqs:GetQueueAttributes   (check queue depth, used by health checks)
    #   - sqs:ChangeMessageVisibility (extend visibility timeout if needed)
    # ─────────────────────────────────────────────────────────────────────────
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/keda-demo-app-role"

    # Token expiration: IRSA tokens are short-lived (default 86400s = 24hr)
    # Tokens are automatically refreshed by the EKS pod identity webhook
    eks.amazonaws.com/token-expiration: "86400"
